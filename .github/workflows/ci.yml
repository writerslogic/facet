# CI: install, lint, typecheck, and test the Facet monorepo on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo to install/lint/typecheck/test.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Release-link check (no placeholder repo slugs)
        run: pnpm check:links

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Migration upgrade test
        run: pnpm check:migrations

      - name: Package check (publint + attw)
        run: pnpm --filter "@writerslogic/*" check:package

      - name: Test
        run: pnpm test

      - name: Install browsers
        run: pnpm --filter @facet/dashboard exec playwright install --with-deps chromium firefox webkit

      - name: Browser end-to-end test
        run: pnpm test:e2e
