# Deploy the public, no-backend static demo to GitHub Pages. The dashboard SPA is built with the
# in-browser mock API baked in (VITE_FACET_STATIC_DEMO=1) and a /facet/ base path, so it runs entirely
# on Pages with fabricated data — no Worker, no D1, no real analytics exposed. See docs/self-hosting.md.
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'packages/shared/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

# Least privilege for Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a newer push supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static demo
        env:
          # A GitHub Pages project site is served from /<repo>/, so derive the asset base path from
          # the repository rather than hardcoding this repo's name — a fork (or a rename) still gets
          # a demo whose assets resolve.
          FACET_BASE: /${{ github.event.repository.name }}/
          VITE_FACET_STATIC_DEMO: '1'
          VITE_FACET_DEMO_LABEL: Live demo
        run: pnpm --filter @facet/dashboard build

      - name: SPA fallback + disable Jekyll
        run: |
          cp apps/dashboard/dist/index.html apps/dashboard/dist/404.html
          touch apps/dashboard/dist/.nojekyll

      # include-hidden-files: v4 of this action started excluding dotfiles from the tarball, which
      # would silently drop the .nojekyll written above.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/dashboard/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
